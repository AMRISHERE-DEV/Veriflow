[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-ionomer"
version = "1.1.3"
description = "Glass Ionomer: claim-level evidence assurance and release gating for AI outputs."
readme = "README.md"
authors = [{name = "Amr Elnaggar"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "ruff==0.12.12",
]

[tool.setuptools.packages.find]
include = ["glass_ionomer*", "veriflow"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "SIM", "RUF"]
# Tuple-form isinstance remains explicit, readable, and supported on Python 3.10.
ignore = ["UP038"]

[tool.ruff.lint.per-file-ignores]
# This enum deliberately uses PASS as a wire-level status string.
"glass_ionomer/verify/status.py" = ["S105"]
# Security rules that are unsafe in production are intentional test mechanisms here
# (S301: a test deliberately pickle-round-trips a trust proof to prove trust is stripped).
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S301", "S310", "S603"]
"examples/*.py" = ["S310"]

[tool.mypy]
python_version = "3.10"
files = ["glass_ionomer"]
